<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchSpace | App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">♥</div>
          <span>MatchSpace</span>
        </div>
        <nav class="nav">
          <a href="/report">รายงานปัญหา</a>
          <button id="logoutBtn" class="button secondary-action" type="button">ออกจากระบบ</button>
        </nav>
      </div>

      <div id="appRoot" class="app-root">
        <div class="tab-header">
          <button class="tab-button active" data-tab="discover">Discover</button>
          <button class="tab-button" data-tab="chat">Chat</button>
          <button class="tab-button" data-tab="profile">Profile</button>
          <button class="tab-button" data-tab="activity">Activity board</button>
        </div>

        <section id="tab-discover" class="tab-panel active">
          <div class="panel discover-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
              <h2 style="margin:0; font-size:1.1rem; color:var(--purple);">✨ ค้นหาคนที่ใช่</h2>
              <button id="viewSkippedBtn" class="button secondary-action" type="button" style="font-size:0.82rem; padding:6px 14px; border-radius:999px;">
                📜 ดูคนที่เคยปัดผ่าน (<span id="skippedCount">0</span>)
              </button>
            </div>
            <div id="discoverUserCard" class="discover-card"></div>
          </div>
        </section>

        <section id="tab-chat" class="tab-panel">
          <div class="chat-layout">
            <div class="panel">
              <h2>แชท</h2>
              <div id="chatList" class="list-card"></div>
            </div>
            <div class="panel">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
                <h2 id="chatTitleHeader" style="margin:0;">ข้อความ</h2>
                <div id="chatSubHeader" style="font-size:0.85rem; color:var(--purple); font-weight:600;"></div>
              </div>
              <div id="messageThread" class="chat-box"></div>
              <div id="greetingSuggestions" class="greeting-suggestions hidden">
                <div class="greeting-label">💡 แนะนำข้อทักทาย:</div>
                <div id="greetingChips" class="greeting-chips"></div>
              </div>
              <div class="composer">
                <input id="messageInput" type="text" placeholder="พิมพ์ข้อความ..." />
                <button id="sendMessageBtn" class="button primary" type="button">ส่ง</button>
              </div>
            </div>
          </div>
        </section>

        <section id="tab-profile" class="tab-panel">
          <div class="panel">
            <h2>โปรไฟล์ของฉัน</h2>
            <form id="profileForm">
              <div class="profile-header">
                <img id="profileImagePreview" class="profile-avatar" alt="profile" />
                <div class="profile-meta">
                  <div class="form-group">
                    <label>อีเมล</label>
                    <div id="profileEmail" class="readonly-box"></div>
                  </div>
                </div>
              </div>

              <div class="form-grid profile-grid">
                <div class="form-group">
                  <label for="profileName">ชื่อ-นามสกุล</label>
                  <input id="profileName" type="text" />
                </div>

                <div class="form-group">
                  <label for="profileNickname">ชื่อเล่น</label>
                  <input id="profileNickname" type="text" />
                </div>

                <div class="form-group">
                  <label for="profileMajor">คณะ</label>
                  <input id="profileMajor" type="text" />
                </div>

                <div class="form-group">
                  <label for="profileYear">ชั้นปี</label>
                  <input id="profileYear" type="text" />
                </div>

                <div class="form-group">
                  <label for="profileGender">เพศ</label>
                  <select id="profileGender">
                    <option value="ชาย">ชาย</option>
                    <option value="หญิง">หญิง</option>
                    <option value="เพศหลากหลาย">เพศหลากหลาย (LGBTQ+)</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="profileAge">อายุ</label>
                  <input id="profileAge" type="number" min="18" max="60" />
                </div>

                <div class="form-group">
                  <label for="profileImageInput">เปลี่ยนรูปโปรไฟล์</label>
                  <input id="profileImageInput" type="file" accept="image/*" />
                </div>

                <div class="form-group full">
                  <label>ความสนใจ</label>
                  <div id="profileInterestsTags" class="tags-container"></div>
                  <input type="hidden" id="profileInterests" />
                </div>

                <div class="form-group full">
                  <label for="profileBio">ประวัติโดยย่อ</label>
                  <textarea id="profileBio"></textarea>
                <div class="form-group full">
                  <label>อัลบั้มรูปภาพโปรไฟล์ (สูงสุด 6 รูป)</label>
                  <div id="userPhotosGrid" class="user-photos-grid"></div>
                  <input id="userPhotosInput" type="file" accept="image/*" multiple style="display:none;" />
                  <button id="addPhotosBtn" class="button outline" type="button" style="margin-top:10px;">📸 เพิ่มรูปภาพโปรไฟล์</button>
                </div>
              </div>

              <button type="submit" class="button primary" style="width:100%;">บันทึกโปรไฟล์</button>
              <div id="profileStatus" class="message success" style="display:block; background:rgba(27,157,105,0.08); color:var(--success);"></div>
            </form>
          </div>
        </section>

        <section id="tab-activity" class="tab-panel">
          <div class="panel">
            <div class="board-header">
              <h2>Activity board</h2>
              <button id="newActivityBtn" class="button primary" type="button">＋</button>
            </div>

            <form id="activityForm" class="activity-form hidden">
              <div class="form-grid">
                <div class="form-group full">
                  <label for="activityName">ชื่อกิจกรรม</label>
                  <input id="activityName" type="text" placeholder="เช่น Run for Campus" required />
                </div>

                <div class="form-group full">
                  <label for="activityDescription">รายละเอียด</label>
                  <textarea id="activityDescription" placeholder="อธิบายกิจกรรมให้ชัดเจน"></textarea>
                </div>

                <div class="form-group full">
                  <label for="activityLocation">สถานที่จัดกิจกรรม</label>
                  <input id="activityLocation" type="text" placeholder="เช่น ลานกิจกรรมหน้าตึก SC, คาเฟ่หน้ามอ" required />
                </div>

                <div class="form-group">
                  <label for="activityMemberCount">จำนวนคนเข้าร่วม</label>
                  <input id="activityMemberCount" type="number" min="0" value="0" />
                </div>
              </div>

              <div class="activity-form-actions">
                <button type="submit" class="button primary">ส่งคำขออนุมัติ</button>
              </div>
            </form>

            <div id="activityBoardList" class="activity-board"></div>
          </div>
        </section>
      </div>
    </div>

    <!-- Profile Detail Modal with Multi-Photo Gallery Carousel -->
    <div id="profileModal" class="modal hidden">
      <div class="modal-content profile-modal-content">
        <button id="closeProfileModal" class="modal-close-btn" type="button">✕</button>
        <div class="profile-gallery-container">
          <img id="modalProfileImg" src="" alt="Profile Photo" class="modal-profile-img" />
          <div id="modalGalleryNav" class="gallery-nav hidden">
            <button id="prevPhotoBtn" class="gallery-arrow" type="button">‹</button>
            <div id="galleryIndicators" class="gallery-indicators"></div>
            <button id="nextPhotoBtn" class="gallery-arrow" type="button">›</button>
          </div>
        </div>
        <div class="profile-info-box">
          <h2 id="modalProfileName"></h2>
          <div class="profile-badges">
            <span id="modalProfileGender" class="badge"></span>
            <span id="modalProfileAgeMajor" class="badge alt"></span>
          </div>
          <p id="modalProfileBio" class="profile-bio-text"></p>
          <div id="modalProfileInterests" class="chips"></div>
          <div class="profile-modal-actions">
            <button id="modalActionBtn" class="button primary full" type="button">ทักแชท / สนใจ</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Skipped Candidates Modal -->
    <div id="skippedModal" class="modal hidden">
      <div class="modal-content" style="max-width:520px; max-height:85vh; display:flex; flex-direction:column;">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:14px;">
          <h3 style="margin:0; font-size:1.1rem; color:var(--purple);">📜 ประวัติคนที่เคยปัดผ่าน</h3>
          <button id="closeSkippedModal" class="modal-close-btn" type="button" style="position:static;">✕</button>
        </div>
        <div id="skippedList" style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-right:4px;">
          <!-- Dynamically populated skipped candidates -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
